name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install both distributions and test dependencies
        run: python -m pip install -e '.[dev]' -e ./mcp
      - name: Check changed Python lint
        env:
          LINT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE="$LINT_BASE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          python scripts/check_changed_flake8.py --base "$BASE"
      - name: Run complete test suite
        run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build both wheels and source distributions with reproducible timestamps
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          python -m pip install build
          python -m build --wheel --sdist --outdir dist .
          python -m build --wheel --sdist --outdir dist ./mcp
          python -m build --wheel --sdist --outdir dist2 .
          python -m build --wheel --sdist --outdir dist2 ./mcp
      - name: Verify byte-for-byte reproducibility of all release artifacts
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def get_hashes(directory: Path):
              return {
                  p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in directory.iterdir() if p.is_file()
              }

          h1 = get_hashes(Path("dist"))
          h2 = get_hashes(Path("dist2"))
          assert len(h1) == 4, f"Expected 4 artifacts, found {len(h1)}"
          assert h1 == h2, f"Reproducibility mismatch: {h1} vs {h2}"
          print("All 4 artifacts verified byte-for-byte reproducible: PASS")
          PY
      - name: Check source distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          for archive_path in sorted(Path("dist").glob("*.tar.gz")):
              with tarfile.open(archive_path, "r:gz") as archive:
                  names = archive.getnames()
              assert not any(Path(name).name.startswith("._") for name in names)
              if archive_path.name.startswith("mighty_mouse_mcp-"):
                  assert any(name.endswith("/README.md") for name in names)
          PY
      - name: Install only built wheels in a clean environment
        run: |
          python -m venv /tmp/mighty-mouse-wheel-venv
          /tmp/mighty-mouse-wheel-venv/bin/python -m pip install dist/mighty_mouse-*.whl dist/mighty_mouse_mcp-*.whl
      - name: Smoke test installed wheels outside checkout
        working-directory: /tmp
        run: |
          PY=/tmp/mighty-mouse-wheel-venv/bin/python
          CLI=/tmp/mighty-mouse-wheel-venv/bin/mighty-mouse
          AUDIT=/tmp/mighty-mouse-wheel-venv/bin/mighty-mouse-signal-audit
          AG_RUNNER=/tmp/mighty-mouse-wheel-venv/bin/mighty-mouse-antigravity-pretooluse
          AG_POST_RUNNER=/tmp/mighty-mouse-wheel-venv/bin/mighty-mouse-antigravity-posttooluse
          "$PY" -c "from importlib.metadata import version; import mighty_mouse; assert mighty_mouse.__version__ == version('mighty-mouse')"
          "$PY" -c "import mighty_mouse_mcp.server, mighty_mouse_mcp.hooks, mighty_mouse_mcp.antigravity_hooks"
          "$CLI" --help
          "$CLI" protocol "CI packaging smoke" --json | "$PY" -c "import json,sys; d=json.load(sys.stdin); assert d['interface']=='protocol' and d['schema_version']==1"
          mkdir -p /tmp/mighty-mouse-verify-smoke
          "$CLI" verify /tmp/mighty-mouse-verify-smoke --test-command "$PY -c 'print(\"wheel smoke passed\")'" --json | "$PY" -c "import json,sys; d=json.load(sys.stdin); assert d['interface']=='verify' and d['passed'] is True"
          "$AUDIT" /tmp/mighty-mouse-verify-smoke --receipt-hash deadbeef --after 2026-01-01T00:00:00+00:00 >/dev/null || test $? -eq 1
          echo '{"invalid": "json' | "$AG_RUNNER" | "$PY" -c "import json,sys; d=json.load(sys.stdin); assert d['decision']=='deny' and d['status']=='deny'"
          echo '{"invalid": "json' | "$AG_POST_RUNNER" | "$PY" -c "import json,sys; d=json.load(sys.stdin); assert d == {}"
          "$PY" - <<'PY'
          import asyncio
          import os
          import sys

          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client


          async def main():
              parameters = StdioServerParameters(
                  command=sys.executable,
                  args=["-m", "mighty_mouse_mcp.server"],
                  env=os.environ.copy(),
              )
              async with stdio_client(parameters) as streams:
                  async with ClientSession(*streams) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      names = {tool.name for tool in tools.tools}
                      expected = {
                          "protocol",
                          "verify",
                          "setup_workspace",
                          "recording_audit",
                          "verify_and_record",
                          "run",
                          "agent_execute",
                          "swarm_execute",
                          "policy_status",
                          "policy_preview",
                          "policy_pin",
                          "policy_rollback",
                          "compute_scaling_status",
                          "compute_scaling_preview",
                          "compute_scaling_pin",
                      }
                      assert names == expected, sorted(expected ^ names)
                      assert len(names) == 15


          asyncio.run(main())
          PY
